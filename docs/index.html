<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MOD Checklist Seahaven</title>

  <!-- PWA & Android Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#17431f">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iPhone / iOS Safari PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MOD Seahaven">
  <link rel="apple-touch-icon" href="./icon-512.png">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b2210;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #splash {
      position: fixed;
      inset: 0;
      background: #0b2210;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      transition: opacity 0.35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img {
      width: 84px;
      height: 84px;
      object-fit: contain;
      border-radius: 18px;
      background: #f5faf8;
      padding: 8px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #34d399;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 10px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #appFrame {
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background: #f8fafc;
    }

    #installBanner {
      display: none;
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: #17431f;
      color: #ffffff;
      padding: 12px 16px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      z-index: 30;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid #34d399;
    }
    #installBanner button {
      background: #ffffff;
      color: #17431f;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Splash Screen Saat Memuat -->
  <div id="splash">
    <img src="./icon-512.png" alt="Seahaven Logo" onerror="this.style.display='none'">
    <div style="font-size:14px;font-weight:800;letter-spacing:1.5px;color:#a7f3d0;">SEAHAVEN VILLAS</div>
    <div style="font-size:11px;color:#cbd5e1;margin-top:3px;">Memuat MOD Checklist System...</div>
    <div class="spinner"></div>
  </div>

  <!-- Web App Google Apps Script -->
  <iframe
    id="appFrame"
    allow="clipboard-read; clipboard-write"
    onload="document.getElementById('splash').classList.add('hide')">
  </iframe>

  <!-- Banner Install Otomatis untuk Android -->
  <div id="installBanner">
    <div style="font-size:12px;line-height:1.3;">
      <strong>Install Aplikasi MOD Seahaven</strong><br>
      <span style="font-size:11px;color:#d1fae5;">Akses cepat langsung dari layar utama HP</span>
    </div>
    <button id="btnInstallApp">Install</button>
  </div>

  <script>
    // TEMPELKAN LINK WEB APP GOOGLE APPS SCRIPT ANDA DI BAWAH INI:
    const GAS_WEB_APP_URL = https://script.google.com/a/macros/kamuelavillas.com/s/AKfycbxFo10yIJk6PW5jKQrPCG0317F-2wvkP_f48RKYG5kuTpXorQWOI0Ypdi_o6yLzxq7vJg/exec";

    document.getElementById('appFrame').src = GAS_WEB_APP_URL;

    // Registrasi Service Worker PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(console.error);
      });
    }

    // Tangkap Prompt Install Android
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBanner').style.display = 'flex';
    });

    document.getElementById('btnInstallApp').addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('installBanner').style.display = 'none';
    });
  </script>
</body>
</html>
